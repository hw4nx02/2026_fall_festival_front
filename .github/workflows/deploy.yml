name: React 자동 배포

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: React 자동 배포
        shell: bash
        run: |
          set -euo pipefail

          FRONT_DIR=/home/ubuntu/2026_fall_festival_front

          echo "배포 브랜치: $DEPLOY_BRANCH"

          cd "$FRONT_DIR"

          git fetch origin
          git switch -C "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e npm_config_cache=/tmp/.npm \
            -v "$FRONT_DIR:/app" \
            -w /app \
            node:22-alpine \
            sh -c "npm ci && npm run build"

          test -f "$FRONT_DIR/dist/user/index.html"
          test -f "$FRONT_DIR/dist/admin/index.html"
